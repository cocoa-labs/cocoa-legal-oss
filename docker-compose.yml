# Cocoa Legal on Docker Compose: backend, frontend, S3-compatible storage (RustFS)
# and the upload virus scanner (ClamAV), for running on ONE machine (the README
# quickstart). Every port is published on 127.0.0.1 only. This file is not a
# production setup: for a server, follow DEPLOY.md.
#
# Supabase (Postgres + Auth) runs outside this file: `npx supabase@3.1.0 start`
# locally (well-known demo keys; never expose it to a network).
#
#   cp compose.env.example .env            # build args + local storage credentials
#   # set S3_SECRET_KEY in .env, e.g. to the output of: openssl rand -hex 24
#   docker compose up -d --build
#
# Controlled-beta mode (the default in backend/.env.example) refuses uploads
# unless ClamAV is healthy, so the backend waits for it. First start takes a few
# minutes while ClamAV downloads its signature database.
name: cocoa-legal

services:
  # S3-compatible storage for local use. RustFS is an Apache-2.0 object store;
  # in production, point the backend at R2 or S3 instead (see DEPLOY.md).
  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-cocoalegal}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (see compose.env.example)}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (presigned download links point here)
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the bucket once storage is up, then exits.
  storage-init:
    image: amazon/aws-cli:2.40.2
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cocoalegal}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (see compose.env.example)}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket cocoa-legal 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3 mb s3://cocoa-legal
    restart: "no"

  clamav:
    # The -debian variant is multi-architecture (amd64, arm64); the plain tag is amd64-only.
    image: clamav/clamav:1.5.4-debian
    # Loopback only (never expose clamd publicly); lets a backend run with
    # `npm run dev` on the host reach the scanner at localhost:3310.
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  backend:
    build: ./backend
    # Optional so `docker compose up -d rustfs storage-init clamav` works before the
    # backend is configured; the backend itself refuses to boot without its settings.
    env_file:
      - path: backend/.env
        required: false
    environment:
      PORT: "3001"
      R2_ENDPOINT_URL: http://rustfs:9000
      R2_PUBLIC_ENDPOINT_URL: ${R2_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      R2_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cocoalegal}
      R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (see compose.env.example)}
      R2_BUCKET_NAME: cocoa-legal
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SUPABASE_URL: ${BACKEND_SUPABASE_URL:-http://host.docker.internal:54321}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      clamav:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3003}
        NEXT_PUBLIC_SOURCE_CODE_URL: ${NEXT_PUBLIC_SOURCE_CODE_URL:-}
        NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL:-}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-}
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      - backend

volumes:
  s3-data:
  clamav-db:
